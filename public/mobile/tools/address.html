<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0" id="myViewport">
    <link rel="preload" href="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" as="script">
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  </head>
  <body style="margin: 0px;">
    <div id="wrap" style="height:100%;"></div>
    <script>
        const sendDataToNative = (command, data) =>
          [[typeof AOSHandler !== 'undefined' && AOSHandler[command],
            () => AOSHandler[command](JSON.stringify(data))],
           [window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iOSHandler,
            () => window.webkit.messageHandlers.iOSHandler.postMessage({ command, data })]
          ].filter(e => e[0]).forEach(e => e[1]())

        new daum.Postcode(
          { oncomplete: data => sendDataToNative('addressSearchResult', data), width : '100%', height: '100%' }
        ).embed(document.getElementById('wrap'));
    </script>
  </body>
</html>
