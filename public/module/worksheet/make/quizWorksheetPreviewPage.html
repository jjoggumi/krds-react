            .editor-layer:first-of-type { border-top: 0; }

        <script type="text/javascript">
          var objectArr = [];  // 도구 전역 배열
          let isReadonly = false;

          window.addEventListener('message', message => {
            console.warn(`message.data => `, message.data)

            try {
              var payload = message.data
              switch (payload.dispatchEvent) {
                case 'click': {
                  $('#' + payload.name).click()
                  break
                }
                case 'call': {
                  if (payload.name === 'saveToken') {
                    for (const [key, value] of Object.entries(payload.data)) {
                      localStorage.setItem(key, value)
                    }
                  }
                  break
                }
                case 'set': {
                  if (payload.name === 'apiUrl') {
                    apiUrl = payload.data
                  }
                  break
                }
              }
            } catch (e) {
              console.warn(e)
            }
          })
        </script>
